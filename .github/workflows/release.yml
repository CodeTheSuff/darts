# Veröffentlicht das Docker-Image nach ghcr.io, sobald ein GitHub-Release erscheint.
#
# Ablauf (macht tool/github_release.ps1 auf Simons Laptop):
#   1. APK lokal bauen (Release-Schlüssel bleibt auf dem Laptop)
#   2. Tag vX.Y.Z pushen + GitHub-Release mit der APK als Datei anlegen
#   3. Dieser Workflow: APK aus dem Release laden, version.json erzeugen, Image bauen und als
#      ghcr.io/<owner>/darts:X.Y.Z, :X.Y und :latest veröffentlichen
name: Release-Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag (z. B. v3.1.0)'
        required: true

permissions:
  contents: write   # darts-docker.zip ans Release hängen
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Version prüfen (Tag muss zu pubspec.yaml passen)
        id: v
        run: |
          VERSION="$(python3 tool/ci/version_json.py --print-version)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG passt nicht zur Version $VERSION in pubspec.yaml"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/darts" >> "$GITHUB_OUTPUT"

      - name: APK aus dem Release laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci/apk
          gh release download "$TAG" --pattern "Darts_${{ steps.v.outputs.version }}.apk" --dir ci/apk
          APK="Darts_${{ steps.v.outputs.version }}.apk"
          test -s "ci/apk/$APK" || { echo "::error::$APK fehlt im Release $TAG"; exit 1; }
          # Plausibilität: echtes Android-Paket
          unzip -l "ci/apk/$APK" | grep -q AndroidManifest.xml
          python3 tool/ci/version_json.py --apk "$APK" > ci/version.json
          cat ci/version.json

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.minor }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Paket für den Server (darts-docker.zip) ans Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          d=dist/darts-docker
          mkdir -p "$d"
          cp deploy/ghcr/docker-compose.yml deploy/ghcr/ANLEITUNG.md deploy/Caddyfile deploy/install.sh "$d/"
          {
            echo "# Fertiges Image von ghcr.io (latest = immer die neueste Version)"
            echo "DARTS_IMAGE=${{ steps.v.outputs.image }}:latest"
            echo
            cat deploy/.env.example
          } > "$d/.env.example"
          (cd dist && zip -qr darts-docker.zip darts-docker)
          gh release upload "$TAG" dist/darts-docker.zip --clobber

      - name: Zusammenfassung
        run: |
          {
            echo "### Darts ${{ steps.v.outputs.version }} veröffentlicht"
            echo
            echo '```'
            echo "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}"
            echo "${{ steps.v.outputs.image }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
