<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    Basis-Pfad: wird beim Bauen durch `flutter build web --base-href /pfad/` ersetzt
    (Standard "/"). Muss mit "/" beginnen und enden.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Darts – Punktezähler, Training, Minispiele und Turniere">

  <!--
    viewport-fit=cover: Die App zeichnet bis unter Notch und Home-Leiste; Flutter liest die
    Safe-Area (env(safe-area-inset-*)) und SafeArea/AppBar halten den Inhalt frei.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- Home-Bildschirm (iPhone/iPad und Android) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Darts">
  <meta name="application-name" content="Darts">
  <meta name="theme-color" content="#1C1E25">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>Darts</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Dunkler Hintergrund ab der ersten Millisekunde (kein weißer Blitz),
       feste Höhe ohne 100vh-Fehler (Safari), kein Gummiband-Scrollen. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1C1E25;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1C1E25;
      transition: opacity .25s ease-out;
      z-index: 0;
    }
    #splash img {
      width: 144px;
      height: 144px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    #splash .bar {
      margin-top: 28px;
      width: 120px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, #2F6FD6, #5FD8EE, #DDF6FF);
      opacity: .7;
    }
    #splash .err {
      display: none;
      margin: 24px 24px 0;
      max-width: 320px;
      color: #B9BCC8;
      font: 15px/1.4 -apple-system, system-ui, sans-serif;
      text-align: center;
    }
    #splash.failed .err { display: block; }
    #splash.failed img { animation: none; }
    #splash.hide { opacity: 0; pointer-events: none; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .9; }
      50% { transform: scale(1.04); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="splash" aria-label="Darts wird geladen">
    <img src="icons/splash.png" alt="">
    <div class="bar"></div>
    <div class="err">Darts konnte nicht geladen werden. Bitte prüfe die Verbindung und lade die Seite neu.</div>
  </div>
  <!-- Lädt die App (siehe web/flutter_bootstrap.js: lokales CanvasKit, eigener Service Worker). -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
