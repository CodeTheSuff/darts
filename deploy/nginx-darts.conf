# Darts – Beispiel für nginx als Reverse-Proxy vor dem Server (127.0.0.1:8080).
#
# Ablage z. B. /etc/nginx/sites-available/darts.conf, dann:
#   ln -s /etc/nginx/sites-available/darts.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# HTTPS-Zertifikat z. B. mit certbot:  certbot --nginx -d darts.example.org
# "darts.example.org" überall durch die eigene (Sub-)Domain ersetzen.
# Im Darts-Dienst TRUST_PROXY=true setzen.

# WebSocket: "Connection: upgrade" nur, wenn der Browser ein Upgrade will.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream darts_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name darts.example.org;

    # Let's-Encrypt-Prüfung (certbot) erlauben, sonst alles auf HTTPS umleiten.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;   # bei nginx < 1.25.1 diese Zeile löschen und "listen 443 ssl http2;" schreiben
    server_name darts.example.org;

    ssl_certificate     /etc/letsencrypt/live/darts.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darts.example.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 8m;

    # WebSocket-Relais
    location /ws {
        proxy_pass http://darts_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Verbindungen bleiben lange offen (die App pingt alle 15 s).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Web-App, /health, /version.json, /apk/…
    location / {
        proxy_pass http://darts_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
